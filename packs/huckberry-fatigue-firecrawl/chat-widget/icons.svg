<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Gladly Chat SDK v2 — icon sprite (12 symbols)
    ============================================================================
    WHAT THIS IS
      A single-request SVG sprite. Every icon is a <symbol> with the *exact*
      viewBox and path data lifted verbatim from the production React icon
      components in `sagansystems/chat-sdk`, `web-v2/src/components/icons/`.
      Geometry was copied, never redrawn.

    SOURCE
      web-v2/src/components/icons/{Chat,Close,XClose,Maximize,Panel,SoundOn,
      SoundOff,PaperPlane,Paperclip,ChevronDown,BrokenImage,Lock}.tsx
      Inventory / rendered sizes: docs/plans/2026-08-12-001-chat-sdk-v2-design-spec.md §7

    USAGE
      <svg class="cw-icon"><use href="icons.svg#cw-icon-chat"/></svg>

      Size the *outer* <svg> in CSS (the symbol scales to it); the sprite sets
      no width/height. viewBoxes are NOT normalized — each keeps its source box,
      so aspect ratios differ. Documented rendered sizes:
        chat 32x32 (24x24 in the FAB)   close 22x2      x-close 16x16
        maximize 20x18                  panel 20x18     sound-on/off 20x20
        paper-plane 16x16               paperclip 16x18 chevron-down 24x24
        broken-image 24x24              lock 10x14
      Served over HTTP(S), same-origin. `file://` will not resolve external
      <use> fragments in Chrome — serve the directory.

    COLOR
      Everything is fill/stroke="currentColor" and inherits from CSS, with two
      documented exceptions:
        - #cw-icon-broken-image — fixed #B3B3B3 (matches production; the image
          fallback is intentionally not themeable).
        - #cw-icon-lock — defaults to white, parameterized via the custom
          property `cw-lock-color` — written with the usual two-hyphen CSS
          prefix; it cannot be spelled literally inside an XML comment.
          Source prop was `fill = '#fff'`. Set that property to `currentColor`
          to make the lock follow inherited text color instead.

    GOTCHAS — do not "fix" these
      - #cw-icon-close is genuinely 22x2 (viewBox "0 0 22 2"). It is the single
        horizontal *minimize* bar, not a symmetric close glyph. Correct as-is.
      - #cw-icon-sound-on uses viewBox "0 -2.5 20 20" (negative min-y) while
        #cw-icon-sound-off uses "0 0 20 20". They differ in source; the spec §7
        table lists them on one row with the sound-on box. Source wins here.
      - Stroke-only icons (close, chevron-down) carry fill="none"; removing it
        fills the stroke path into a solid blob.
      - Lock.tsx ships no viewBox — only width="10" height="14". The viewBox
        below is derived from those intrinsic dimensions so the symbol scales.
      - The paper-plane clipPath id is namespaced (`cw-icon-paper-plane-clip`,
        source: `clip0_6371_191`) to avoid colliding with host-page ids.
    ============================================================================
  -->

