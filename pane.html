<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path A — Gladly twin (data-driven)</title>
<!--
  Data-driven cw- twin. Loads demo-spec.json, renders turns + ProductList.
  Fail-closed: no imageUrl → omit ProductCard.
  Soft-close honesty when softClose=true (no Added / Pay UI).
  Stock green header unless prospect.accent set.
-->
<style>
  /* CSS hrefs injected after pack resolve — placeholders until then */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f5f5; }
  #boot-err {
    font: 14px/1.4 system-ui, sans-serif;
    padding: 24px;
    color: #b00020;
    display: none;
  }
  /* Fill iframe/viewport — without this .cw-host/.cw-stage collapse to h=0 */
  .cw-host {
    display: block;
    width: 100%;
    height: 100%;
  }
  .cw-stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 500px;
    margin: 0 auto;
    overflow: hidden;
  }
  .cw-stage .cw-container,
  .cw-stage .cw-container.cw-is-panel,
  .cw-stage .cw-container.cw-is-fullscreen {
    position: absolute !important;
    inset: 0;
    width: 100%;
    max-width: none;
    height: 100% !important;
    top: 0; right: 0; bottom: 0; left: 0;
    padding-bottom: 0;
    padding-left: 0;
    padding-right: 0;
    border-radius: 24px 24px 0 0;
    transform: none;
  }
  .cw-stage .cw-body {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
  }
  /* Film-only price under name — production ProductCard SoT is name+image */
  .cw-stage .cw-product-card-content {
    height: auto;
    min-height: 36px;
  }
  .cw-stage .cw-product-card-price {
    display: block;
    margin-top: 4px;
    font-family: var(--font-secondary, 'Helvetica Neue', Helvetica, sans-serif);
    font-size: 14px;
    font-weight: 400;
    line-height: 18px;
    color: inherit;
  }
  .cw-stage .cw-product-list.hf-compare-2 {
    gap: 16px;
    margin: 8px 0 16px;
  }
  .cw-stage .cw-product-list.hf-compare-2 .cw-product-card {
    flex: 1 1 calc(50% - 8px);
  }
  .cw-stage .cw-msg[hidden],
  .cw-stage .cw-product-list[hidden] { display: none !important; }
</style>
</head>
<body>

  <symbol id="cw-icon-chevron-down" viewBox="0 0 42 42" fill="none">
    <path d="m13 17 8 8 8-8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
  </symbol>
</svg>

<div id="boot-err" role="alert"></div>

<div class="cw-host" id="screen" hidden>
  <div class="cw-stage">
    <div class="cw-container cw-is-panel" id="widget" role="dialog" aria-modal="true" aria-label="Chat">
      <div class="cw-focus-sentinel" tabindex="0"></div>

      <header class="cw-header" id="header">
        <img class="cw-header-logo" id="header-logo" alt=""
          src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23ffffff'/%3E%3Ctext x='20' y='27' font-family='Helvetica' font-size='18' font-weight='700' text-anchor='middle' fill='%23111111'%3EH%3C/text%3E%3C/svg%3E">
        <div class="cw-header-titles" id="header-titles">
          <p class="cw-header-heading" id="header-heading">Chat</p>
          <p class="cw-header-subheading" id="header-subheading">AI shopping associate</p>
        </div>
        <div class="cw-header-actions" id="header-actions">
          <button class="cw-header-btn" id="btn-sound" aria-label="Turn sound off" type="button">
            <svg class="cw-icon cw-icon-sound-on" aria-hidden="true"><use href="#cw-icon-sound-on"></use></svg>
          </button>
          <button class="cw-header-btn cw-header-btn-mode" id="btn-mode" aria-label="Expand to fullscreen" type="button">
            <svg class="cw-icon cw-icon-maximize" aria-hidden="true"><use href="#cw-icon-maximize"></use></svg>
          </button>
          <button class="cw-header-btn" id="btn-minimize" aria-label="Minimize chat" type="button">
            <svg class="cw-icon cw-icon-close" aria-hidden="true"><use href="#cw-icon-close"></use></svg>
          </button>
        </div>
      </header>

      <div class="cw-body" id="body">
        <div class="cw-messages" id="messages"></div>
        <button class="cw-scroll-btn" id="scroll-btn" aria-label="Scroll to latest" type="button" hidden>
          <svg class="cw-icon cw-icon-chevron-down" aria-hidden="true"><use href="#cw-icon-chevron-down"></use></svg>
        </button>
      </div>

      <footer class="cw-footer" id="footer">
        <div class="cw-composer" id="composer">
          <div class="cw-composer-pill" id="composer-pill">
            <button class="cw-attach-btn" id="attach" aria-label="Attach a file" type="button">
              <svg class="cw-icon cw-icon-paperclip" aria-hidden="true"><use href="#cw-icon-paperclip"></use></svg>
            </button>
            <textarea class="cw-composer-input" id="composer-input" rows="1" maxlength="1000" aria-label="Type a message" placeholder="Write a message…" readonly></textarea>
            <button class="cw-send-btn" id="send" aria-label="Send" type="button">
              <svg class="cw-icon cw-icon-paper-plane" aria-hidden="true"><use href="#cw-icon-paper-plane"></use></svg>
            </button>
          </div>
        </div>
        <div class="cw-powered-by" id="powered-by"><a class="cw-powered-by-link" href="#powered-by">Powered by Gladly</a></div>
      </footer>

      <div class="cw-focus-sentinel" tabindex="0"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var pack = params.get("pack") || "huckberry-fatigue-firecrawl";
  var specUrl = params.get("spec") || ("packs/" + pack + "/demo-spec.json");
  var packBase = "packs/" + pack + "/";
  var animate = params.get("animate") !== "0"; // default: sequential reveal
  var live = params.get("live") === "1" || params.has("live");
  var playGen = 0;
  var currentSpec = null;
  var cssReady = null;

  function fail(msg) {
    var el = document.getElementById("boot-err");
    el.style.display = "block";
    el.textContent = msg;
    console.error(msg);
  }

  function clearBootErr() {
    var el = document.getElementById("boot-err");
    el.style.display = "none";
    el.textContent = "";
  }

  function loadCss(href) {
    return new Promise(function (resolve, reject) {
      // Skip duplicate loads (live remounts / pack swaps)
      var existing = document.querySelector('link[rel="stylesheet"][href="' + href + '"]');
      if (existing) {
        resolve(href);
        return;
      }
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      link.onload = function () { resolve(href); };
      link.onerror = function () { reject(new Error("CSS failed: " + href)); };
      document.head.appendChild(link);
    });
  }

  function ensureCss(base) {
    var cssBase = base + "chat-widget/";
    return Promise.all([
      loadCss(cssBase + "chat-tokens.css"),
      loadCss(cssBase + "chat-shell.css"),
      loadCss(cssBase + "chat-chrome.css"),
      loadCss(cssBase + "chat-messages.css")
    ]);
  }

  function resolveAsset(url) {
    if (!url) return "";
    if (/^(https?:|data:|\/)/i.test(url)) return url;
    // Pack-relative (film-assets/…) or demo-root-relative (packs/…)
    if (url.indexOf("packs/") === 0) return url;
    return packBase + url;
  }

  function inferPackBase(spec) {
    var path = (spec && spec.plate && spec.plate.path) || "";
    var m = String(path).match(/^(packs\/[^/]+)\//);
    if (m) return m[1] + "/";
    if (spec && spec.__pack) return "packs/" + spec.__pack + "/";
    return packBase;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /** Fail-closed ProductCard: no usable imageUrl → omit card. */
  function renderProductCard(p) {
    var img = (p.imageUrl || "").trim();
    if (!img) return "";
    var src = resolveAsset(img);
    var name = escapeHtml(p.name || "");
    var href = escapeHtml(p.pageUrl || "#");
    // displayPrice is FILM-ONLY — production ProductCard SoT has no price
    var price = (p.displayPrice && String(p.displayPrice).trim())
      ? '<span class="cw-product-card-price">' + escapeHtml(p.displayPrice) + "</span>"
      : "";
    return (
      '<a class="cw-product-card" href="' + href + '" target="_blank" rel="noopener">' +
        '<div class="cw-product-card-media"><div class="cw-product-card-image-well">' +
          '<img class="cw-product-card-image" alt="' + name + '" src="' + escapeHtml(src) + '">' +
        "</div></div>" +
        '<div class="cw-product-card-content">' +
          '<span class="cw-product-card-name">' + name + "</span>" +
          price +
        "</div>" +
      "</a>"
    );
  }

  function renderProductList(products) {
    if (!products || !products.length) return "";
    var cards = products.map(renderProductCard).filter(Boolean);
    if (!cards.length) return ""; // fail-closed: all cards omitted → no list
    var cls = cards.length === 2 ? "cw-product-list hf-compare-2" : "cw-product-list";
    return '<div class="' + cls + '" id="products-compare" aria-label="Products">' + cards.join("") + "</div>";
  }

  function applyAccent(prospect) {
    var host = document.getElementById("screen");
    var accent = (prospect && prospect.accent) ? String(prospect.accent).trim() : "";
    host.style.removeProperty("--color-header-background");
    host.style.removeProperty("--cw-accent");
    if (!accent || accent === "green") {
      host.setAttribute("data-accent", "green");
      return;
    }
    if (accent === "purple") {
      host.setAttribute("data-accent", "purple");
      return;
    }
    // Custom CSS color → set header vars directly; keep green token as fallback base
    host.setAttribute("data-accent", "green");
    host.style.setProperty("--color-header-background", accent);
    host.style.setProperty("--cw-accent", accent);
  }

  function setHeaderLogoLetter(title) {
    var letter = (title || "G").charAt(0).toUpperCase();
    var svg =
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'>" +
      "<rect width='40' height='40' rx='8' fill='%23ffffff'/>" +
      "<text x='20' y='27' font-family='Helvetica' font-size='18' font-weight='700' text-anchor='middle' fill='%23111111'>" +
      letter +
      "</text></svg>";
    document.getElementById("header-logo").src = "data:image/svg+xml;utf8," + svg;
  }

  function buildMessages(spec) {
    var root = document.getElementById("messages");
    root.innerHTML = "";
    var turns = (spec.turns || []).slice().sort(function (a, b) { return a.i - b.i; });
    var productsHtml = renderProductList(spec.products || []);
    var productsInserted = false;
    var softClose = !!spec.softClose;

    turns.forEach(function (t) {
      var roleClass = t.role === "shopper" ? "cw-msg-user" : "cw-msg-agent";
      var div = document.createElement("div");
      div.className = "cw-msg " + roleClass;
      div.id = "msg-" + t.i;
      div.setAttribute("data-msg", String(t.i));
      div.setAttribute("data-role", t.role);
      if (t.beat) div.setAttribute("data-beat", t.beat);
      if (animate) div.hidden = true;
      div.innerHTML = '<p class="cw-msg-text">' + escapeHtml(t.text) + "</p>";
      root.appendChild(div);

      // Insert ProductList after compare agent turn (film lock: cards with compare beat)
      if (!productsInserted && productsHtml && t.role === "agent" && t.beat === "compare") {
        var wrap = document.createElement("div");
        wrap.innerHTML = productsHtml;
        var list = wrap.firstChild;
        if (animate) list.hidden = true;
        // Soft-close: never add ATC / Pay chrome beside cards
        if (softClose) list.setAttribute("data-soft-close", "true");
        root.appendChild(list);
        productsInserted = true;
      }
    });

    // If compare beat never fired but products exist, append at end
    if (!productsInserted && productsHtml) {
      var wrap2 = document.createElement("div");
      wrap2.innerHTML = productsHtml;
      var list2 = wrap2.firstChild;
      if (animate) list2.hidden = true;
      if (softClose) list2.setAttribute("data-soft-close", "true");
      root.appendChild(list2);
    }

    // Soft-close honesty: never inject Added / cart / Pay UI
    var widget = document.getElementById("widget");
    if (softClose) {
      widget.setAttribute("data-soft-close", "true");
    } else {
      widget.removeAttribute("data-soft-close");
    }
  }

  function revealSequential() {
    var gen = ++playGen;
    var root = document.getElementById("messages");
    var kids = Array.prototype.slice.call(root.children);
    var i = 0;
    var typingEl = null;

    function scrollBottom() {
      var body = document.getElementById("body");
      body.scrollTop = body.scrollHeight;
    }

    function clearTyping() {
      if (typingEl && typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
      typingEl = null;
    }

    function showTyping() {
      clearTyping();
      typingEl = document.createElement("div");
      typingEl.className = "cw-msg cw-msg-agent";
      typingEl.setAttribute("aria-live", "polite");
      typingEl.innerHTML =
        '<div class="cw-typing" aria-hidden="true">' +
        '<span class="cw-typing-dot"></span>' +
        '<span class="cw-typing-dot"></span>' +
        '<span class="cw-typing-dot"></span>' +
        "</div>" +
        '<span class="cw-sr-only" role="status">Agent is typing</span>';
      root.appendChild(typingEl);
      scrollBottom();
    }

    function next() {
      if (gen !== playGen) {
        clearTyping();
        return;
      }
      if (i >= kids.length) {
        clearTyping();
        scrollBottom();
        return;
      }
      var el = kids[i];
      var isAgent = el.classList.contains("cw-msg-agent");
      var isProducts = el.classList.contains("cw-product-list");
      var delayAfter = isProducts ? 900 : isAgent ? 1100 : 650;

      function reveal() {
        if (gen !== playGen) {
          clearTyping();
          return;
        }
        clearTyping();
        el.hidden = false;
        scrollBottom();
        i += 1;
        setTimeout(next, delayAfter);
      }

      if (isAgent || isProducts) {
        showTyping();
        setTimeout(reveal, isProducts ? 700 : 850);
      } else {
        clearTyping();
        reveal();
      }
    }
    // Brief settle before first shopper bubble
    setTimeout(next, 400);
  }

  function mount(spec) {
    clearBootErr();
    // Cancel any in-flight progressive reveal before rebuild
    playGen += 1;

    packBase = inferPackBase(spec);
    var m = packBase.match(/^packs\/([^/]+)\//);
    if (m) pack = m[1];

    document.title = (spec.header && spec.header.title ? spec.header.title : "Chat") + " — Gladly twin";
    document.getElementById("header-heading").textContent =
      (spec.header && spec.header.title) || (spec.prospect && spec.prospect.name) || "Chat";
    document.getElementById("header-subheading").textContent =
      (spec.header && spec.header.subtitle) || "AI shopping associate";
    document.getElementById("widget").setAttribute(
      "aria-label",
      ((spec.prospect && spec.prospect.name) || "Chat") + " chat"
    );
    setHeaderLogoLetter(
      (spec.header && spec.header.title) || (spec.prospect && spec.prospect.name) || "G"
    );
    applyAccent(spec.prospect);
    buildMessages(spec);
    document.getElementById("screen").hidden = false;
    currentSpec = spec;
    if (animate) revealSequential();
    // Expose for parent / film tooling
    window.__PATH_A_SPEC = spec;
    window.__PATH_A_PACK = pack;
  }

  function replay() {
    if (!currentSpec) return;
    mount(currentSpec);
  }

  function isAllowedMessage(event) {
    if (event.source !== window.parent) return false;
    // Same-origin parent only (empty origin for sandboxed about:blank is ok if source matches)
    if (event.origin && event.origin !== location.origin && event.origin !== "null") {
      return false;
    }
    return true;
  }

  function onParentMessage(event) {
    if (!isAllowedMessage(event)) return;
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.type === "path-a-mount" && data.spec) {
      var nextBase = inferPackBase(data.spec);
      ensureCss(nextBase)
        .then(function () { mount(data.spec); })
        .catch(function (err) {
          fail("Live mount CSS failed: " + (err && err.message ? err.message : err));
        });
      return;
    }
    if (data.type === "path-a-replay") {
      replay();
    }
  }

  // Always listen when live=1; also listen if embedded (harmless for standalone ?pack=)
  if (live || window.parent !== window) {
    window.addEventListener("message", onParentMessage);
  }
  // Expose for debugging
  window.__PATH_A_MOUNT = mount;
  window.__PATH_A_REPLAY = replay;

  cssReady = ensureCss(packBase);

  var bootPromise = cssReady;
  // Fetch-based mount path (unchanged). With live=1 and no explicit pack override,
  // still fetch default pack as fallback until parent posts path-a-mount.
  if (!live || params.get("pack") || params.get("spec")) {
    bootPromise = cssReady.then(function () {
      return fetch(specUrl, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("demo-spec fetch " + r.status + " for " + specUrl);
        return r.json();
      });
    }).then(mount);
  } else {
    // live=1 alone: wait for parent postMessage (CSS already loading)
    bootPromise = cssReady;
  }

  bootPromise.catch(function (err) {
    fail("Path A pane failed: " + (err && err.message ? err.message : err));
  });
})();
</script>
